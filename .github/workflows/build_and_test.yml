name: Smart Cook CI/CD & GitHub Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_build:
    name: Lint, Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis (Zero Issues Check)
        run: flutter analyze

      - name: 🧪 Execute Automated Unit, Integration & Widget Tests
        run: flutter test

      - name: 🚀 Build Release APK (Obfuscated)
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Smart-Cook.apk

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-cook-release-apk
          path: build/app/outputs/flutter-apk/Smart-Cook.apk
          if-no-files-found: warn

      - name: 🎉 Publish GitHub Release (on Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Smart-Cook.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
